<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#ffffff"><meta name="description" content="Jannis Scheurich — Design, Sound und interaktive Systeme.">
<title>Jannis Scheurich — Portfolio</title>
<style>
:root{--green:#00e66b;--muted:#9d9d9d;--side:280px;--ink:#202020}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:white;color:var(--ink);font-family:Arial,Helvetica,sans-serif;font-size:14px}button,a{font:inherit}a{color:inherit;text-decoration:none}button{cursor:pointer}.site{max-width:1320px;margin:auto;display:grid;grid-template-columns:var(--side) minmax(0,1fr);min-height:100vh}.sidebar{position:sticky;top:0;height:100vh;padding:34px 28px 28px;align-self:start;background:white;z-index:5}.brand{display:inline-block;font-size:26px;line-height:.94;font-weight:800;letter-spacing:-1.15px;margin-bottom:48px}.nav-label,.contact a{font-size:12px;color:var(--green);font-weight:700}.nav-label{margin:0 0 16px}.project-nav{display:flex;flex-direction:column;gap:11px;margin-bottom:30px}.project-nav a{color:var(--muted);line-height:1.15;transition:color .15s}.project-nav a:hover,.project-nav a.active{color:var(--ink);font-style:italic}.contact{display:flex;flex-direction:column;align-items:flex-start;gap:14px}.contact a:hover{text-decoration:underline}.content{min-width:0}.gallery{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}.tile{display:block;position:relative;aspect-ratio:1/1;overflow:hidden;background:#151515}.tile:nth-child(4n+2),.tile:nth-child(4n+3){background:#e7e7e7}.tile img{width:100%;height:100%;display:block;object-fit:cover;object-position:50% 50%;transition:transform .5s}.tile:hover img{transform:scale(1.045)}.tile .visual{position:absolute;inset:0;display:grid;place-items:center;overflow:hidden}.tile .visual::before{content:"";width:58%;aspect-ratio:1;border:1px solid rgba(255,255,255,.42);border-radius:50%;box-shadow:0 0 90px rgba(153,148,255,.22),inset 0 0 70px rgba(154,177,251,.14);transform:rotate(-20deg)}.tile:nth-child(2) .visual::before{border-radius:23% 77% 60% 40%;transform:rotate(34deg);background:linear-gradient(140deg,transparent,rgba(163,168,255,.4),transparent)}.tile:nth-child(3) .visual::before{width:80%;border-radius:0;transform:rotate(-17deg);box-shadow:20px 40px 0 rgba(255,255,255,.07)}.tile:nth-child(4) .visual::before{width:43%;border-radius:8%;background:linear-gradient(40deg,#b6b4ab,#f1efe9,#a9a7a2);box-shadow:22px 25px 45px #aaa}.tile:nth-child(5) .visual::before{width:18%;height:80%;border-radius:0;background:linear-gradient(#a368e3,#e3b4ff,#6e4de0);box-shadow:0 0 90px #6c38d0}.tile:nth-child(6) .visual::before{width:65%;border-radius:0;transform:rotate(14deg);background:repeating-linear-gradient(90deg,#d1d5d9 0 10px,#939fa8 10px 12px)}.tile-label{position:absolute;inset:0;background:rgba(0,230,107,.91);display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;color:#101010;font-size:clamp(18px,2.2vw,32px);font-weight:800;letter-spacing:-.5px;opacity:0;transition:opacity .18s}.tile:hover .tile-label,.tile:focus-visible .tile-label{opacity:1}.project-page{padding:30px 0 90px}.project-heading{text-align:center;padding:0 30px 46px}.project-heading h1{font-size:clamp(30px,3.2vw,52px);line-height:1;letter-spacing:-1.6px;margin:0;font-weight:800;text-transform:uppercase}.project-heading p{font-size:13px;font-style:italic;margin:5px 0 0}.hero{width:100%;aspect-ratio:16/9;background:#141414;display:grid;place-items:center;color:#b6b6b6;text-align:center;padding:20px}.hero span{font-size:12px;letter-spacing:.1em;text-transform:uppercase}.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:36px;margin-top:36px}.detail-text h2{font-size:clamp(19px,2vw,27px);line-height:1.04;color:var(--green);font-weight:400;text-transform:uppercase;margin:0 0 8px}.detail-text p{line-height:1.55;margin:0 0 14px}.detail-art{aspect-ratio:1;background:#121212;display:grid;place-items:center;color:#777;font-size:12px;text-align:center;padding:18px}.detail-art.light{background:#e7e7e7}.detail-grid,.hero,.project-heading{margin-left:0;margin-right:0}.back{display:inline-block;color:var(--green);font-weight:bold;margin:38px 0 0}.mobile-header{display:none}.menu-button{background:none;border:0;padding:8px;display:flex;flex-direction:column;gap:5px}.menu-button span{width:24px;height:2px;background:#202020;display:block}.empty{padding:45px}.hidden{display:none!important}:focus-visible{outline:2px solid var(--green);outline-offset:3px}@media(min-width:1321px){.site{--side:280px}}@media(max-width:850px){.site{--side:230px}.sidebar{padding:28px 22px}.brand{font-size:24px}.detail-grid{gap:18px}.project-page{padding-top:24px}}@media(max-width:620px){.site{display:block}.mobile-header{height:82px;display:flex;align-items:center;justify-content:space-between;padding:16px 20px;background:white;position:sticky;top:0;z-index:10}.mobile-header .brand{font-size:22px;margin:0}.sidebar{display:none;position:fixed;top:82px;left:0;right:0;height:calc(100dvh - 82px);overflow-y:auto;padding:30px 22px;background:white;z-index:9}.sidebar.open{display:block}.sidebar>.brand{display:none}.project-nav{gap:17px}.project-nav a{font-size:17px}.gallery{grid-template-columns:1fr}.tile{aspect-ratio:1/1}.tile-label{font-size:25px}.project-page{padding-top:28px}.project-heading{padding:0 20px 32px}.project-heading h1{font-size:32px}.detail-grid{grid-template-columns:1fr;gap:20px;margin-top:28px}.detail-text{padding:0 20px}.detail-art{min-height:280px}.back{margin-left:20px}.hero{aspect-ratio:4/3}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.tile img,.tile-label{transition:none}}
</style>
</head>
<body>
<div class="mobile-header"><a class="brand" href="#/" aria-label="Startseite">JANNIS<br>SCHEURICH</a><button id="menuButton" class="menu-button" aria-label="Menü öffnen" aria-expanded="false"><span></span><span></span><span></span></button></div>
<div class="site"><aside class="sidebar" id="sidebar"><a class="brand" href="#/">JANNIS<br>SCHEURICH</a><nav aria-label="Projekte"><p class="nav-label"><a href="#/">WORK</a></p><div class="project-nav" id="projectNav"></div></nav><div class="contact"><a href="mailto:kontakt@example.com" id="contactLink">GET IN TOUCH</a><a href="#/impressum">IMPRESSUM</a></div></aside><main class="content" id="app"></main></div>
<script>
/* HIER PROJEKTE BEARBEITEN. Bilddateien können später z.B. unter assets/ liegen. */
const projects=[
 {id:'im-schein',title:'IM SCHEIN',subtitle:'Licht wird Klang',heading:'ZWISCHEN LICHT UND KLANG',description:'Eine interaktive Installation, in der Licht durch Solarzellen in hörbare Signale übersetzt wird. Die Besucherinnen und Besucher verändern den Klang unmittelbar durch ihre Bewegungen.',image:'images/im-schein-cover.jpg',theme:'dark'},
 {id:'sonnenlicht',title:'Sonnenlicht-Skulpturen',subtitle:'UV · Visible · IR',heading:'SONNENLICHT ALS SIGNAL',description:'Eine experimentelle Untersuchung von Sonnenlicht als gestalterischem Material. Unterschiedliche Bereiche des Lichtspektrums werden erfasst und in musikalische Parameter übertragen.',image:'',theme:'dark'},
 {id:'sounddesign',title:'Sounddesign',subtitle:'Klang und Interaktion',heading:'GESTALTUNG DURCH KLANG',description:'Ausgewählte Arbeiten aus dem Bereich Sounddesign und interaktive Klanggestaltung. Projektmaterial und Hörbeispiele werden ergänzt.',image:'',theme:'dark'},
 {id:'projekt-04',title:'Projekt 04 — Platzhalter',subtitle:'Projekt folgt',heading:'PROJEKT IN ARBEIT',description:'Hier entsteht die Dokumentation eines weiteren Projekts.',image:'',theme:'light'},
 {id:'projekt-05',title:'Projekt 05 — Platzhalter',subtitle:'Projekt folgt',heading:'PROJEKT IN ARBEIT',description:'Hier entsteht die Dokumentation eines weiteren Projekts.',image:'',theme:'dark'},
 {id:'projekt-06',title:'Projekt 06 — Platzhalter',subtitle:'Projekt folgt',heading:'PROJEKT IN ARBEIT',description:'Hier entsteht die Dokumentation eines weiteren Projekts.',image:'',theme:'light'}
];
const app=document.getElementById('app'),nav=document.getElementById('projectNav'),sidebar=document.getElementById('sidebar'),menuButton=document.getElementById('menuButton');
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function closeMenu(){sidebar.classList.remove('open');menuButton.setAttribute('aria-expanded','false');menuButton.setAttribute('aria-label','Menü öffnen')}
menuButton.addEventListener('click',()=>{const open=sidebar.classList.toggle('open');menuButton.setAttribute('aria-expanded',String(open));menuButton.setAttribute('aria-label',open?'Menü schließen':'Menü öffnen')});
function render(){const path=decodeURIComponent(location.hash.replace(/^#\/?/,'')).replace(/\/$/,'');const selected=projects.find(p=>p.id===path);nav.innerHTML=projects.map(p=>`<a href="#/${p.id}" class="${selected===p?'active':''}">${esc(p.title)}</a>`).join('');
if(!path){app.innerHTML=`<section class="gallery" aria-label="Projektübersicht">${projects.map((p,i)=>`<a class="tile" href="#/${p.id}" aria-label="${esc(p.title)}"><div class="visual" aria-hidden="true"></div>${p.image?`<img src="${esc(p.image)}" alt="" loading="lazy">`:''}<span class="tile-label">${esc(p.title)}</span></a>`).join('')}</section>`}
else if(selected){app.innerHTML=`<article class="project-page"><header class="project-heading"><h1>${esc(selected.title)}</h1><p>${esc(selected.subtitle)}</p></header><div class="hero">${selected.image?`<img src="${esc(selected.image)}" alt="${esc(selected.title)}" style="width:100%;height:100%;object-fit:cover">`:'<span>Projektvideo / großes Projektbild folgt</span>'}</div><section class="detail-grid"><div class="detail-text"><h2>${esc(selected.heading)}</h2><p>${esc(selected.description)}</p><p>Weitere Bilder, Videos und Informationen ergänzen wir hier später.</p></div><div class="detail-art ${selected.theme==='light'?'light':''}">Weitere Projektdokumentation folgt</div></section><a class="back" href="#/">← ALLE PROJEKTE</a></article>`}
else if(path==='impressum'){app.innerHTML='<section class="empty"><h1>Impressum</h1><p>Vor der öffentlichen Nutzung bitte vollständige rechtliche Angaben ergänzen.</p><a class="back" href="#/">← ZURÜCK</a></section>'}
else{app.innerHTML='<section class="empty"><h1>Seite nicht gefunden</h1><a href="#/">Zur Projektübersicht</a></section>'}
closeMenu();window.scrollTo(0,0)}
window.addEventListener('hashchange',render);render();
</script>
</body></html>
