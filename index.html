<div class="site"><aside class="sidebar" id="sidebar"><a class="brand" href="#/">JANNIS<br>SCHEURICH</a><nav aria-label="Projekte"><p class="nav-label"><a href="#/">WORK</a></p><div class="project-nav" id="projectNav"></div></nav><div class="contact"><a href="mailto:kontakt@example.com" id="contactLink">GET IN TOUCH</a><a href="#/impressum">IMPRESSUM</a></div></aside><main class="content" id="app"></main></div>
<script>
/* HIER PROJEKTE BEARBEITEN. Bilddateien können später z.B. unter assets/ liegen. */
const projects=[
 {id:'im-schein',title:'IM SCHEIN',subtitle:'Sichtbarer Klang, klingendes Licht',heading:'ZWISCHEN LICHT UND KLANG',description:'Eine interaktive Installation, in der Licht durch Solarzellen in hörbare Signale übersetzt wird. Die Besucherinnen und Besucher verändern den Klang unmittelbar durch ihre Bewegungen.',image:'images/im-schein-cover.jpg',theme:'dark'},
 {id:'sonnenlicht',title:'Sonnenlicht-Skulpturen',subtitle:'UV · Visible · IR',heading:'SONNENLICHT ALS SIGNAL',description:'Eine experimentelle Untersuchung von Sonnenlicht als gestalterischem Material. Unterschiedliche Bereiche des Lichtspektrums werden erfasst und in musikalische Parameter übertragen.',image:'',theme:'dark'},
 {id:'sounddesign',title:'Sounddesign',subtitle:'Klang und Interaktion',heading:'GESTALTUNG DURCH KLANG',description:'Ausgewählte Arbeiten aus dem Bereich Sounddesign und interaktive Klanggestaltung. Projektmaterial und Hörbeispiele werden ergänzt.',image:'',theme:'dark'},
 {id:'projekt-04',title:'Projekt 04 — Platzhalter',subtitle:'Projekt folgt',heading:'PROJEKT IN ARBEIT',description:'Hier entsteht die Dokumentation eines weiteren Projekts.',image:'',theme:'light'},
 {id:'projekt-05',title:'Projekt 05 — Platzhalter',subtitle:'Projekt folgt',heading:'PROJEKT IN ARBEIT',description:'Hier entsteht die Dokumentation eines weiteren Projekts.',image:'',theme:'dark'},
 {id:'projekt-06',title:'Projekt 06 — Platzhalter',subtitle:'Projekt folgt',heading:'PROJEKT IN ARBEIT',description:'Hier entsteht die Dokumentation eines weiteren Projekts.',image:'',theme:'light'}
];
const app=document.getElementById('app'),nav=document.getElementById('projectNav'),sidebar=document.getElementById('sidebar'),menuButton=document.getElementById('menuButton');
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function closeMenu(){sidebar.classList.remove('open');menuButton.setAttribute('aria-expanded','false');menuButton.setAttribute('aria-label','Menü öffnen')}
menuButton.addEventListener('click',()=>{const open=sidebar.classList.toggle('open');menuButton.setAttribute('aria-expanded',String(open));menuButton.setAttribute('aria-label',open?'Menü schließen':'Menü öffnen')});
let videoObservers=[];
function initPortfolioVideos(){
 const vids=[['prototypeVideo','prototypeSoundToggle','prototypeSoundLabel'],['exhibitionVideo','exhibitionSoundToggle','exhibitionSoundLabel']];
 if(!document.getElementById('prototypeVideo') && !document.getElementById('exhibitionVideo'))return;
 if(!window.Vimeo || !window.Vimeo.Player){
  if(!document.getElementById('vimeoPlayerSdk')){
   const script=document.createElement('script');script.id='vimeoPlayerSdk';
   script.src='https://player.vimeo.com/api/player.js';script.onload=initPortfolioVideos;
   document.head.appendChild(script);
  }
  return;
 }
 for(const [frameId,buttonId,labelId] of vids){
  const iframe=document.getElementById(frameId);if(!iframe)continue;
  const player=new window.Vimeo.Player(iframe);
  const button=document.getElementById(buttonId);
  const label=document.getElementById(labelId);
  if(button){button.addEventListener('click',async()=>{
   const wasOn=button.getAttribute('aria-pressed')==='true';
   try{
    await player.setMuted(wasOn);
    if(!wasOn){await player.setVolume(1);await player.play();}
    button.setAttribute('aria-pressed',String(!wasOn));
    button.setAttribute('aria-label',wasOn?'Enable sound':'Mute sound');
    label.textContent=wasOn?'ENABLE SOUND':'MUTE SOUND';
    button.querySelector('svg').innerHTML=wasOn?'<path d="M11 5 6 9H3v6h3l5 4V5Z"/><path d="m16 9 5 6m0-6-5 6"/>':'<path d="M11 5 6 9H3v6h3l5 4V5Z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/>';
   }catch(err){console.warn('Vimeo audio control:',err);}
  });}
  const observer=new IntersectionObserver(entries=>{
   if(!document.contains(iframe)){observer.disconnect();return;}
   if(entries[0].isIntersecting){player.play().catch(()=>{});}
   else{player.pause().catch(()=>{});}
  },{threshold:0.35});
  observer.observe(iframe);videoObservers.push(observer);
 }
}
function render(){videoObservers.forEach(observer=>observer.disconnect());videoObservers=[];const path=decodeURIComponent(location.hash.replace(/^#\/?/,'')).replace(/\/$/,'');const selected=projects.find(p=>p.id===path);nav.innerHTML=projects.map(p=>`<a href="#/${p.id}" class="${selected===p?'active':''}">${esc(p.title)}</a>`).join('');
if(!path){app.innerHTML=`<section class="gallery" aria-label="Projektübersicht">${projects.map((p,i)=>`<a class="tile" href="#/${p.id}" aria-label="${esc(p.title)}"><div class="visual" aria-hidden="true"></div>${p.image?`<img src="${esc(p.image)}" alt="" loading="lazy">`:''}<span class="tile-label">${esc(p.title)}</span></a>`).join('')}</section>`}
else if(selected && selected.id==='im-schein'){
app.innerHTML=`<article class="project-page im-schein-page">
 <header class="project-heading"><h1>IM SCHEIN</h1><p>Sichtbarer Klang, klingendes Licht</p></header>
 <figure class="im-hero"><img src="images/hero.jpg" alt="Hands holding solar-cell receivers within the illuminated field of the installation"></figure>
 <section class="im-intro im-columns"><div><p class="im-eyebrow">INTERACTIVE SOUND INSTALLATION · 2025</p><h2>Light becomes sound.<br>Without a line of code.</h2></div><div class="im-lead"><p><strong>IM SCHEIN</strong> is an interactive installation that makes sound physically tangible through light. Instead of reading sensor values and translating them into programmed commands, the work relies on a direct transformation of energy: sound modulates light, and solar cells convert that light back into an electrical audio signal.</p><p>No coding, scripting or digital signal processing is required within the light-to-sound transmission. The sound emerges from the physical relationship between light source, receiver, space and movement.</p></div></section>
 <figure class="im-wide"><img src="images/overview.jpg" loading="lazy" alt="The complete cylindrical installation placed in a bright room"><figcaption>The installation as a sculptural object in space.</figcaption></figure>
 <section class="im-section im-columns"><div><p class="im-eyebrow">01 / THE PRINCIPLE</p><h2>An audio signal carried by light.</h2></div><div><p>An audio signal controls the brightness of the LEDs at high speed. These changes are too fast to be perceived visually, yet the varying light carries the fluctuations of the original sound.</p><p>When a solar cell receives this light, it produces corresponding fluctuations in electrical voltage. Once amplified, these become audible again. The signal is not interpreted as data: it is transmitted through a physical process.</p></div></section>
 <div class="im-signal" aria-label="Audio signal modulates LED light; solar cell converts received light to voltage changes; amplification produces audible sound"><span>AUDIO SIGNAL</span><b>→</b><span>MODULATED LED LIGHT</span><b>→</b><span>SOLAR CELL</span><b>→</b><span>VOLTAGE FLUCTUATIONS</span><b>→</b><span>AUDIBLE SOUND</span></div>
 <div class="im-photo-pair"><figure><img src="images/light-detail.jpg" loading="lazy" alt="Close-up of the individually positioned LED light modules"><figcaption>Individually positioned LED emitters generate overlapping fields of modulated light.</figcaption></figure><figure><img src="images/sensor.jpg" loading="lazy" alt="Handheld solar-cell receiver worn across three fingers"><figcaption>A handheld solar cell becomes the physical receiver of the audio signal.</figcaption></figure></div>
 <section class="im-section im-columns"><div><p class="im-eyebrow">02 / INTERACTION</p><h2>Movement becomes composition.</h2></div><div><p>Visitors move the handheld receivers through the light field. Distance, orientation, shadows and overlapping beams affect what reaches each solar cell—and therefore what can be heard.</p><p>There are no on-screen controls or predefined gestures. The body shapes the listening experience through its presence in the space. Light becomes an audible material, and the visitor becomes part of the instrument.</p></div></section>
 <figure class="im-wide"><img src="images/interaction.jpg" loading="lazy" alt="A visitor holding a solar-cell receiver over the glowing LED sculpture"><figcaption>Light, movement and proximity shape the sound in real time.</figcaption></figure>
 <section class="im-section im-exhibition-section" aria-labelledby="exhibitionHeading">
  <p class="im-eyebrow">03 / EXHIBITION DOCUMENTATION</p>
  <h2 id="exhibitionHeading">Experiencing sound through light.</h2>
  <div class="im-exhibition-grid">
   <div class="im-video-stage"><div class="im-video-wrap"><iframe id="exhibitionVideo" title="IM SCHEIN — Exhibition Documentation" src="https://player.vimeo.com/video/1234711912?autoplay=0&amp;muted=1&amp;loop=1&amp;title=0&amp;byline=0&amp;portrait=0&amp;dnt=1" loading="lazy" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe><button id="exhibitionSoundToggle" class="im-sound-toggle" type="button" aria-label="Enable sound" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4V5Z"/><path d="m16 9 5 6m0-6-5 6"/></svg><span id="exhibitionSoundLabel">ENABLE SOUND</span></button></div></div>
   <div class="im-exhibition-description"><p>Recorded during the exhibition, this footage shows the finished installation in use. Visitors explore the sculptural field of LEDs with handheld solar-cell receivers, shaping what they hear through movement, distance and orientation.</p><p>The recording documents the experience in its actual exhibition setting, where light becomes an audible material and the visitor becomes part of the instrument.</p><a class="im-vimeo-link" href="https://vimeo.com/1234711912" target="_blank" rel="noopener noreferrer">Watch on Vimeo ↗</a></div>
  </div>
 </section>
 <div class="im-photo-pair im-photo-pair--tall"><figure><img src="images/interaction-detail.jpg" loading="lazy" alt="Handheld sensors above the light installation in a dark room"><figcaption>The interaction is based on continuous physical coupling, not symbolic commands.</figcaption></figure><figure><img src="images/sensor-back.jpg" loading="lazy" alt="Finger-mounted receiver shown from the rear"><figcaption>Wearable receiver detail.</figcaption></figure></div>
 <section class="im-section im-columns"><div><p class="im-eyebrow">04 / DESIGN APPROACH</p><h2>Beyond the interface.</h2></div><div><p>IM SCHEIN explores an alternative to interfaces built around buttons, screens and programmed input. The work invites people to engage with technology through an immediate sensory response rather than a system of abstract instructions.</p><p>The installation is both a sculptural object and an open instrument: its behaviour emerges from the interplay of physical properties, spatial conditions and individual movement.</p></div></section>
 <div class="im-photo-pair"><figure><img src="images/sculpture.jpg" loading="lazy" alt="Full-height sculptural LED installation"><figcaption>A central cylindrical body supports a field of flexible light elements.</figcaption></figure><figure><img src="images/ambient.jpg" loading="lazy" alt="Glowing light elements against a dark background"><figcaption>The light field is a visible object as well as an invisible carrier of sound.</figcaption></figure></div>
 <section class="im-section im-columns"><div><p class="im-eyebrow">05 / MAKING</p><h2>Electronics as part of the form.</h2></div><div><p>The work combines individual LED emitters, a custom-built connection and distribution system, and handheld solar-cell receivers. The physical construction and signal path were developed together so that the technology could remain responsive while becoming a coherent sculptural installation.</p><p>The documentation below reveals selected components of the physical setup. An early prototype test shows how the light-to-sound transmission worked before the elements were integrated into the final sculpture.</p></div></section>
