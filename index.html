body,.project-nav a,.detail-text p,.detail-art,.hero span,.empty p,.back{font-family:var(--font-body)}
/* Alle Überschriften inkl. Sidebar-Navigation, Untertitel, Bildkachel-Titel */
.brand,.nav-label,.nav-label a,.contact a,.tile-label,
.project-heading h1,.project-heading p,.detail-text h2,
.empty h1,.empty h2,.empty h3{font-family:var(--font-heading)}
.brand{font-size:30px;line-height:1.15;font-weight:700}
.nav-label,.contact a{font-size:17px;line-height:1.35;font-weight:600}

@media(max-width:620px){.im-schein-page .project-heading{padding-bottom:32px}.im-columns{grid-template-columns:1fr;gap:18px}.im-intro{margin:34px 20px 50px}.im-section{margin:58px 20px 26px}.im-hero{aspect-ratio:4/3}.im-hero img{object-position:center center}.im-wide img{aspect-ratio:4/3}.im-wide figcaption{padding:0 20px}.im-signal{margin:0 20px;gap:8px;padding:20px;display:block}.im-signal span,.im-signal b{display:inline}.im-signal b{margin:0 7px}.im-photo-pair{grid-template-columns:1fr;gap:19px;margin-top:20px}.im-photo-pair figcaption{padding:0 20px}.im-photo-pair img{aspect-ratio:4/3}.im-footer{margin:70px 20px 0;grid-template-columns:1fr 1fr;gap:20px 15px}}

function initPortfolioVideos(){

   document.head.appendChild(script);
  }
  return;
 }
 for(const [frameId,buttonId,labelId] of vids){
  const iframe=document.getElementById(frameId);if(!iframe)continue;
  const player=new window.Vimeo.Player(iframe);
  const startAt=frameId==='csGameplayVideo'?22:0;
  let initialSeeked=false;
  if(startAt){player.ready().then(()=>player.setCurrentTime(startAt)).then(()=>{initialSeeked=true;}).catch(()=>{});}
  const button=document.getElementById(buttonId);
  const label=document.getElementById(labelId);
  if(button){button.addEventListener('click',async()=>{
   const wasOn=button.getAttribute('aria-pressed')==='true';
   try{
    await player.setMuted(wasOn);
    if(!wasOn){await player.setVolume(1);await player.play();}
    button.setAttribute('aria-pressed',String(!wasOn));
    button.setAttribute('aria-label',wasOn?'Enable sound':'Mute sound');
    label.textContent=wasOn?'ENABLE SOUND':'MUTE SOUND';
    button.querySelector('svg').innerHTML=wasOn?'<path d="M11 5 6 9H3v6h3l5 4V5Z"/><path d="m16 9 5 6m0-6-5 6"/>':'<path d="M11 5 6 9H3v6h3l5 4V5Z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/>';
   }catch(err){console.warn('Vimeo audio control:',err);}
  });}
  const observer=new IntersectionObserver(entries=>{
   if(!document.contains(iframe)){observer.disconnect();return;}
   if(entries[0].isIntersecting){(startAt&&!initialSeeked?player.setCurrentTime(startAt).then(()=>{initialSeeked=true;}):Promise.resolve()).then(()=>player.play()).catch(()=>{});}
   else{player.pause().catch(()=>{});}
  },{threshold:0.35});
  observer.observe(iframe);videoObservers.push(observer);
 }
}

app.innerHTML=`<article class="project-page im-schein-page">
 <header class="project-heading"><h1>IM SCHEIN</h1><p>Sichtbarer Klang, klingendes Licht</p></header>
 <figure class="im-hero"><img src="images/hero.jpg" alt="Hands holding solar-cell receivers within the illuminated field of the installation"></figure>
 <section class="im-intro im-columns"><div><p class="im-eyebrow">INTERACTIVE SOUND INSTALLATION · 2025</p><h2>Light becomes sound.<br>Without a line of code.</h2></div><div class="im-lead"><p><strong><em>IM SCHEIN</em></strong> is an interactive installation that makes sound physically tangible through light. Instead of reading sensor values and translating them into programmed commands, the work relies on a direct transformation of energy: sound modulates light, and solar cells convert that light back into an electrical audio signal.</p><p>No coding, scripting or digital signal processing is required within the light-to-sound transmission. The sound emerges from the physical relationship between light source, receiver, space and movement.</p></div></section>
 <figure class="im-wide"><img src="images/overview.jpg" loading="lazy" alt="The complete cylindrical installation placed in a bright room"><figcaption>The installation as a sculptural object in space.</figcaption></figure>
 <section class="im-section im-columns"><div><p class="im-eyebrow">01 / THE PRINCIPLE</p><h2>An audio signal carried by light.</h2></div><div><p>An audio signal controls the brightness of the LEDs at high speed. These changes are too fast to be perceived visually, yet the varying light carries the fluctuations of the original sound.</p><p>When a solar cell receives this light, it produces corresponding fluctuations in electrical voltage. Once amplified, these become audible again. The signal is not interpreted as data: it is transmitted through a physical process.</p></div></section>
 <div class="im-signal" aria-label="Audio signal modulates LED light; solar cell converts received light to voltage changes; amplification produces audible sound"><span>AUDIO SIGNAL</span><b>→</b><span>MODULATED LED LIGHT</span><b>→</b><span>SOLAR CELL</span><b>→</b><span>VOLTAGE FLUCTUATIONS</span><b>→</b><span>AUDIBLE SOUND</span></div>
 <div class="im-photo-pair"><figure><img src="images/light-detail.jpg" loading="lazy" alt="Close-up of the individually positioned LED light modules"><figcaption>Individually positioned LED emitters generate overlapping fields of modulated light.</figcaption></figure><figure><img src="images/sensor.jpg" loading="lazy" alt="Handheld solar-cell receiver worn across three fingers"><figcaption>A handheld solar cell becomes the physical receiver of the audio signal.</figcaption></figure></div>
 <section class="im-section im-columns"><div><p class="im-eyebrow">02 / INTERACTION</p><h2>Movement becomes composition.</h2></div><div><p>Visitors move the handheld receivers through the light field. Distance, orientation, shadows and overlapping beams affect what reaches each solar cell—and therefore what can be heard.</p><p>There are no on-screen controls or predefined gestures. The body shapes the listening experience through its presence in the space. Light becomes an audible material, and the visitor becomes part of the instrument.</p></div></section>
 <figure class="im-wide"><img src="images/interaction.jpg" loading="lazy" alt="A visitor holding a solar-cell receiver over the glowing LED sculpture"><figcaption>Light, movement and proximity shape the sound in real time.</figcaption></figure>
 <section class="im-section im-exhibition-section" aria-labelledby="exhibitionHeading">
  <p class="im-eyebrow">03 / EXHIBITION DOCUMENTATION</p>
  <h2 id="exhibitionHeading">Experiencing sound through light.</h2>
  <div class="im-exhibition-grid">
   <div class="im-video-stage"><div class="im-video-wrap"><iframe id="exhibitionVideo" title="IM SCHEIN — Exhibition Documentation" src="https://player.vimeo.com/video/1234711912?autoplay=0&amp;muted=1&amp;loop=1&amp;title=0&amp;byline=0&amp;portrait=0&amp;dnt=1" loading="lazy" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe><button id="exhibitionSoundToggle" class="im-sound-toggle" type="button" aria-label="Enable sound" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4V5Z"/><path d="m16 9 5 6m0-6-5 6"/></svg><span id="exhibitionSoundLabel">ENABLE SOUND</span></button></div></div>
   <div class="im-exhibition-description"><p>Recorded during the exhibition, this footage shows the finished installation in use. Visitors explore the sculptural field of LEDs with handheld solar-cell receivers, shaping what they hear through movement, distance and orientation.</p><a class="im-vimeo-link" href="https://vimeo.com/1234711912" target="_blank" rel="noopener noreferrer">Watch on Vimeo ↗</a></div>
  </div>
 </section>
 <div class="im-photo-pair im-photo-pair--tall"><figure><img src="images/interaction-detail.jpg" loading="lazy" alt="Handheld sensors above the light installation in a dark room"><figcaption>The interaction is based on continuous physical coupling, not symbolic commands.</figcaption></figure><figure><img src="images/sensor-back.jpg" loading="lazy" alt="Finger-mounted receiver shown from the rear"><figcaption>Wearable receiver detail.</figcaption></figure></div>
 <section class="im-section im-columns"><div><p class="im-eyebrow">04 / DESIGN APPROACH</p><h2>Beyond the interface.</h2></div><div><p><strong><em>IM SCHEIN</em></strong> explores an alternative to interfaces built around buttons, screens and programmed input. The work invites people to engage with technology through an immediate sensory response rather than a system of abstract instructions.</p><p>The installation is both a sculptural object and an open instrument: its behaviour emerges from the interplay of physical properties, spatial conditions and individual movement.</p></div></section>
 <div class="im-photo-pair im-photo-pair--sculpture"><figure><img src="images/sculpture.jpg" loading="lazy" alt="Full-height sculptural LED installation"><figcaption>A central cylindrical body supports a field of flexible light elements.</figcaption></figure><figure><img src="images/ambient.jpg" loading="lazy" alt="Glowing light elements against a dark background"><figcaption>The illuminated LED elements form the sculpture while carrying the audio signal through light.</figcaption></figure></div>
 <section class="im-section im-columns"><div><p class="im-eyebrow">05 / MAKING</p><h2>From experiment to installation.</h2></div><div><p>The installation brings together a sculptural arrangement of LED light sources and handheld solar-cell receivers. What began as an experimental setup evolved into an interactive object that makes the relationship between light, sound and movement physically tangible.</p></div></section>
 <section class="im-section im-prototype-section" aria-labelledby="prototypeHeading">
  <p class="im-eyebrow">06 / PROTOTYPE TEST</p>
  <h2 id="prototypeHeading">Testing the signal before the sculpture.</h2>
  <div class="im-prototype-grid">
   <div class="im-video-stage"><div class="im-video-wrap"><iframe id="prototypeVideo" title="IM SCHEIN — Prototype Testing" src="https://player.vimeo.com/video/1234706363?autoplay=0&amp;muted=1&amp;loop=1&amp;title=0&amp;byline=0&amp;portrait=0&amp;dnt=1" loading="lazy" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe><button id="prototypeSoundToggle" class="im-sound-toggle" type="button" aria-label="Enable sound" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4V5Z"/><path d="m16 9 5 6m0-6-5 6"/></svg><span id="prototypeSoundLabel">ENABLE SOUND</span></button></div></div>
   <div class="im-prototype-description"><p>An early functional test during the construction phase. With the components still exposed and not yet arranged as a sculpture, the prototype demonstrates the direct light-to-sound transmission and the response of the handheld solar-cell receiver.</p><a class="im-vimeo-link" href="https://vimeo.com/1234706363" target="_blank" rel="noopener noreferrer">Watch on Vimeo ↗</a></div>
  </div>
 </section>
 <div class="im-photo-pair"><figure><img src="images/electronics.jpg" loading="lazy" alt="Hand-built circuit board and connected cables"><figcaption>Custom wiring and circuit-board assembly.</figcaption></figure><figure><img src="images/overview.jpg" loading="lazy" alt="Installed work in the exhibition space"><figcaption>Final installation in its spatial context.</figcaption></figure></div>
 <footer class="im-footer"><div><span>PROJECT</span><strong>IM SCHEIN</strong></div><div><span>TYPE</span><strong>Interactive light–sound installation</strong></div><div><span>CONTEXT</span><strong>Bachelor project · Communication Design · THWS</strong></div><div><span>YEAR</span><strong>2025</strong></div></footer>
 <a class="back" href="#/">← ALL PROJECTS</a>
 </article>`;

app.innerHTML=`<article class="project-page ohr-page">
 <header class="project-heading"><h1>ohr.</h1><p>Making ultrasound audible</p></header>
 <figure class="ohr-hero"><img src="images/ohr-hero.jpg" alt="Analogue ultrasound installation on an exhibition table with microphone, electronics and oscilloscope"></figure>
 <section class="ohr-intro im-columns"><div><p class="ohr-eyebrow">INTERACTIVE SOUND INSTALLATION · OWN PROJECT</p><h2>Making the smallest movements audible.</h2></div><div class="ohr-copy"><p><strong><em>ohr.</em></strong> is an analogue interactive sound installation that turns subtle hand movements into audible changes in pitch. Instead of operating a digital interface, visitors become part of a physical process: their bodies reflect an otherwise inaudible ultrasonic signal.</p><p>The sound responds immediately to movement — without code, programmed gestures or software-based interpretation.</p></div></section>
 <section class="ohr-section im-columns"><div><p class="ohr-eyebrow">01 / THE INTERACTION</p><h2>Move your hand. Change the sound.</h2></div><div class="ohr-copy"><p>An ultrasonic emitter sends out a high-frequency tone. A microphone positioned in the same direction receives the sound reflected by a hand placed in the field.</p><p>As the hand moves towards or away from the setup, the reflected frequency shifts. Even small gestures become audible variations, allowing visitors to explore movement as a form of sound-making.</p></div></section>
 <section class="ohr-video-section im-exhibition-section" aria-labelledby="ohrVideoHeading">
  <p class="ohr-eyebrow">02 / EXHIBITION DOCUMENTATION</p>
  <h2 id="ohrVideoHeading">Movement, heard in real time.</h2>
  <div class="im-exhibition-grid">
   <div class="im-video-stage"><div class="im-video-wrap"><iframe id="ohrExhibitionVideo" title="ohr. — Exhibition Documentation" src="https://player.vimeo.com/video/1238110416?autoplay=0&amp;muted=1&amp;loop=1&amp;title=0&amp;byline=0&amp;portrait=0&amp;dnt=1" loading="lazy" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe><button id="ohrExhibitionSoundToggle" class="im-sound-toggle" type="button" aria-label="Enable sound" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4V5Z"/><path d="m16 9 5 6m0-6-5 6"/></svg><span id="ohrExhibitionSoundLabel">ENABLE SOUND</span></button></div></div>
   <div class="im-exhibition-description"><p>At the exhibition, visitors could hear how small hand movements changed the pitch of the reflected ultrasonic signal. The recording documents the installation as an immediate, physical listening experience.</p><a class="im-vimeo-link" href="https://vimeo.com/1238110416" target="_blank" rel="noopener noreferrer">Watch on Vimeo ↗</a></div>
  </div>
 </section>
 <figure class="ohr-wide"><img src="images/ohr-installation.jpg" loading="lazy" alt="Ultrasonic equipment and listening station with headphones in the exhibition space"><figcaption>The experimental setup in the exhibition space.</figcaption></figure>
 <section class="ohr-section im-columns"><div><p class="ohr-eyebrow">03 / THE PRINCIPLE</p><h2>A physical signal, not a programmed response.</h2></div><div class="ohr-copy"><p>The changing pitch comes from the Doppler effect: motion towards or away from the source changes the frequency of the reflected ultrasound. A heterodyne receiver shifts these ultrasonic frequencies into the audible range in real time.</p><p>Rather than assigning movements to digital commands, the installation makes a physical relationship between body, space and sound directly perceptible.</p></div></section>
 <div class="ohr-signal" aria-label="Ultrasound transmission, hand reflection, Doppler shift, and audible output"><span>ULTRASOUND</span><b>→</b><span>REFLECTION BY HAND</span><b>→</b><span>FREQUENCY SHIFT</span><b>→</b><span>AUDIBLE SOUND</span></div>
 <figure class="ohr-wide ohr-wide-context"><img src="images/ohr-context.jpg" loading="lazy" alt="The compact electronics and listening station installed on a white exhibition table"><figcaption>Listening through headphones makes the effect of movement immediately perceptible.</figcaption></figure>
 <section class="ohr-section im-columns"><div><p class="ohr-eyebrow">04 / DESIGN APPROACH</p><h2>The body becomes part of the instrument.</h2></div><div class="ohr-copy"><p>The installation explores interaction beyond screens and conventional controls. Sound is not triggered by recognizing a gesture. It emerges from the visitor's physical presence within the ultrasonic field.</p><p>The approach draws on experiments with ultrasonic sound by John Driscoll and translates the underlying physical principle into a direct, hands-on listening experience.</p></div></section>
 <footer class="im-footer"><div><span>PROJECT</span><strong>ohr.</strong></div><div><span>TYPE</span><strong>Analogue interactive sound installation</strong></div><div><span>MY ROLE</span><strong>Independent project · concept and realization</strong></div><div><span>REFERENCE</span><strong>Ultrasonic sound experiments by John Driscoll</strong></div></footer>
 <a class="back" href="#/">← ALL PROJECTS</a>
 </article>`;

else if(selected && selected.id==='corrugated-surfer'){
app.innerHTML=`<article class="project-page corrugated-page">
 <header class="project-heading"><h1>CORRUGATED SURFER</h1><p>Interactive Game Audio</p></header>
 <div class="cs-mood-hero"><video class="cs-mood-video" autoplay muted loop playsinline preload="metadata" poster="images/corrugated-mood-poster.jpg" aria-label="Moving view of the cardboard-inspired Corrugated Surfer game world"><source src="images/corrugated-mood-loop.mp4" type="video/mp4"></video></div>
 <section class="cs-intro im-columns"><div><p class="cs-eyebrow">GAME AUDIO · UNITY / FMOD · 2024</p><h2>A surf game you can feel — and hear.</h2></div><div class="cs-copy"><p><strong><em>Corrugated Surfer</em></strong> is an interactive trade fair game that connects a physical surfboard with a playful virtual world made of corrugated cardboard. Players shift their weight to steer through the course, dodge obstacles and collect points.</p><p>Developed as a collaborative project at Design + Systeme for König &amp; Bauer, the installation brings physical movement and digital gameplay together. My contribution was the <span class="cs-role">sound design and audio implementation</span>, using FMOD to integrate sounds into the Unity game.</p></div></section>
 <section class="cs-section im-columns"><div><p class="cs-eyebrow">01 / THE EXPERIENCE</p><h2>Surfing through a world of cardboard.</h2></div><div class="cs-copy"><p>Instead of a conventional controller, visitors stand on a real balance board. Their movements steer the game character through a stylized obstacle course inspired by the world of corrugated packaging.</p><p>The experience was created for a trade fair setting, where the game could be played on-site and followed by spectators on a large screen.</p></div></section>
 <figure class="cs-experience-photo"><img src="images/corrugated-hero.jpg" loading="lazy" alt="A visitor facing the Corrugated Surfer game screen at the exhibition"><figcaption>Physical play meets the cardboard-inspired game world.</figcaption></figure>

 <section class="cs-section im-columns"><div><p class="cs-eyebrow">02 / MY CONTRIBUTION</p><h2>Sound design for interactive play.</h2></div><div class="cs-copy"><p>As a working student at Design + Systeme, I worked on the game’s sound design and used FMOD to integrate audio into its Unity project. This was my contribution to a larger team project, not a game developed independently by me.</p><p>Sound supports the pace of play and makes events in the virtual world audible. The gameplay recording below focuses on the in-game sound effects without a music track.</p></div></section>

// Show the orange label only while a finger is over a tile.
// Touch-end is deliberately not intercepted: a normal tap opens the project.
let activeTouchTile=null;
function updateTouchedTile(touch){
 const element=document.elementFromPoint(touch.clientX,touch.clientY);
 const tile=element?.closest('.gallery .tile')||null;
 if(activeTouchTile===tile)return;
 if(activeTouchTile)activeTouchTile.classList.remove('is-touched');
 activeTouchTile=tile;
 if(tile)tile.classList.add('is-touched');
}
function clearTouchedTile(){
 if(activeTouchTile)activeTouchTile.classList.remove('is-touched');
 activeTouchTile=null;
}
document.addEventListener('touchstart',event=>{
 if(event.touches.length===1)updateTouchedTile(event.touches[0]);
 else clearTouchedTile();
},{passive:true});
document.addEventListener('touchmove',event=>{
 if(event.touches.length===1)updateTouchedTile(event.touches[0]);
 else clearTouchedTile();
},{passive:true});
document.addEventListener('touchend',clearTouchedTile,{passive:true});
document.addEventListener('touchcancel',clearTouchedTile,{passive:true});
window.addEventListener('hashchange',render);render();
</script>
